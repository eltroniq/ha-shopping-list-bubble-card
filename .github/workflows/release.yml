name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

# A tag push used to start two runs: one for the tag and another when the
# workflow itself published the release. Keep a single trigger and serialize
# manual retries for the same tag.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (received: $TAG)" >&2; exit 1 ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ha-hestia-todo-entry-editor.js dist/ha-hestia-todo-entry-editor.js.map --clobber
          else
            gh release create "$TAG" dist/ha-hestia-todo-entry-editor.js dist/ha-hestia-todo-entry-editor.js.map --title "$TAG" --generate-notes
          fi

      # HACS validates the default branch when a repository is added.
      # Keep the latest release bundle in dist/, but only refresh it on releases.
      - name: Update HACS bundle on the default branch
        run: |
          cp dist/ha-hestia-todo-entry-editor.js "$RUNNER_TEMP/ha-hestia-todo-entry-editor.js"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p dist
          cp "$RUNNER_TEMP/ha-hestia-todo-entry-editor.js" dist/ha-hestia-todo-entry-editor.js
          git add -f dist/ha-hestia-todo-entry-editor.js
          if git diff --cached --quiet; then
            echo "HACS bundle is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: update HACS bundle for $TAG"
            git push origin main
          fi
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Validate published repository structure
        uses: hacs/action@main
        with:
          category: plugin
