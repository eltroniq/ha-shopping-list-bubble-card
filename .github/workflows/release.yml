name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

# A tag push used to start two runs: one for the tag and another when the
# workflow itself published the release. Keep a single trigger and serialize
# manual retries for the same tag.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (received: $TAG)" >&2; exit 1 ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/hestia-todo-entry-editor.js dist/hestia-todo-entry-editor.js.map --clobber
          else
            gh release create "$TAG" dist/hestia-todo-entry-editor.js dist/hestia-todo-entry-editor.js.map --title "$TAG" --generate-notes
          fi
